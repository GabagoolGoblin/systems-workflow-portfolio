name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.lock
      - name: Verify release policy
        run: make policy
      - name: Require a clean checkout
        run: |
          test -z "$(git status --porcelain=v1)"
          test -z "$(find . -path ./.git -prune -o -type d -name __pycache__ -print -o -type f \( -name '*.pyc' -o -name '*.pyo' \) -print)"

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        include_project:
          - directory: projects/catalog-lifecycle
            command: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
          - directory: projects/interface-contract-harness
            command: python3 -B -m unittest discover -s tests -v
          - directory: projects/claim-evidence-linter
            command: PYTHONPATH=src python3 -B -m unittest discover -s tests -v
          - directory: projects/bulk-price-control
            command: python3 -B -m unittest discover -s tests -v
          - directory: projects/catalog-migration-validator
            command: python3 -B -m unittest discover -s tests -v
          - directory: projects/api-integration-contracts
            command: PYTHONPATH=. python3 -B -m unittest discover -s tests -p 'test_*.py' -v
          - directory: projects/ai-evaluation-release-gates
            command: python3 -B -m unittest discover -s tests -v
          - directory: projects/implementation-readiness
            command: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
          - directory: projects/public-product-validation
            command: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
          - directory: projects/support-triage-workbench
            command: python3 -B -m unittest discover -s tests -v
          - directory: projects/human-in-the-loop-control
            command: python3 -B -m unittest discover -s demos/hitl-desktop -p 'test_*.py' -v
          - directory: projects/customer-launch-readiness
            command: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run project tests
        working-directory: ${{ matrix.include_project.directory }}
        run: ${{ matrix.include_project.command }}
      - name: Require no mutation
        run: |
          test -z "$(git status --porcelain=v1)"
          test -z "$(find . -path ./.git -prune -o -type d -name __pycache__ -print -o -type f \( -name '*.pyc' -o -name '*.pyo' \) -print)"

  scans-and-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run project scans
        run: make scans
      - name: Verify generated examples
        run: make generated
      - name: Require no mutation
        run: |
          test -z "$(git status --porcelain=v1)"
          test -z "$(find . -path ./.git -prune -o -type d -name __pycache__ -print -o -type f \( -name '*.pyc' -o -name '*.pyo' \) -print)"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.lock
      - name: Install locked browser verifier
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
          python3 -m playwright install --with-deps firefox
      - name: Install native GUI verifier
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Run offline browser checks
        run: make browser
      - name: Require no mutation
        run: |
          test -z "$(git status --porcelain=v1)"
          test -z "$(find . -path ./.git -prune -o -type d -name __pycache__ -print -o -type f \( -name '*.pyc' -o -name '*.pyo' \) -print)"
