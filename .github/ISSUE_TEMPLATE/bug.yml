name: Bug report
description: Dormant scaffold; not active while Issues are disabled.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This template is dormant while Issues are disabled. If the owner explicitly activates it later, do not include credentials, private records, employer/customer material, or production data. For a vulnerability, follow SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest synthetic reproduction and exact command.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and browser version if relevant.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data boundary
      options:
        - label: I removed credentials, personal data, and employer/customer material.
          required: true
